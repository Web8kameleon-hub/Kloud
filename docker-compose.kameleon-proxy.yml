services:
  edge-proxy:
    image: nginx:1.27-alpine
    container_name: kameleon_edge_proxy
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/kameleon.life.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
