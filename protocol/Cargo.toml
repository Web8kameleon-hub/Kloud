[package]
name = "protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
rmp-serde = "1.1"
algebra = { path = "../algebra" }
security = { path = "../security" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
lru = "0.12"
sha3 = "0.10"
quinn = "0.10"
rustls = "0.21"
rcgen = "0.11"