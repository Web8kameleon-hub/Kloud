services:
  dashboard:
    build: ./dashboard
    ports:
      - "3001:8080"
    environment:
      - NANOGRID_ENDPOINT=http://node1:8000
    depends_on:
      - node1
  grafana:
    image: grafana/grafana:oss
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard/grafana:/etc/grafana/provisioning
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
