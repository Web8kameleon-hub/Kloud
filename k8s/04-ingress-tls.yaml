---
# ═══════════════════════════════════════════════════════════════
# Ingress Controller and Ingress Resources
# ═══════════════════════════════════════════════════════════════

# Ingress for API and Frontend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kloud-ingress
  namespace: kloud
  labels:
    app: kloud
  annotations:
    # Nginx annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # CORS annotations
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    
    # Cert manager for automatic SSL
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Prometheus monitoring
    prometheus.io/probe: "true"

spec:
  ingressClassName: nginx
  
  tls:
    - hosts:
        - kloud.com
        - api.kloud.com
        - app.kloud.com
      secretName: kloud-tls-cert
  
  rules:
    # API routes
    - host: api.kloud.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kloud-api-service
                port:
                  number: 8000
    
    # Frontend routes
    - host: app.kloud.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kloud-frontend-service
                port:
                  number: 3000
    
    # Main domain - serve frontend
    - host: kloud.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kloud-api-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kloud-frontend-service
                port:
                  number: 3000
    
    # Metrics endpoint
    - host: metrics.kloud.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-service
                port:
                  number: 9090

---
# Certificate Issuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@kloud.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
# Certificate Issuer for staging (for testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@kloud.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
# Certificate resource (manually triggered)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kloud-cert
  namespace: kloud
spec:
  secretName: kloud-tls-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - kloud.com
    - "*.kloud.com"
    - api.kloud.com
    - app.kloud.com
    - metrics.kloud.com

---
# Backend Configuration for API with timeouts
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: kloud
data:
  api-config.conf: |
    upstream api_backend {
      least_conn;
      server kloud-api-service:8000;
      keepalive 32;
    }
    
    upstream frontend_backend {
      server kloud-frontend-service:3000;
      keepalive 32;
    }
    
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;

---
# Gateway (alternative to Ingress - Kubernetes 1.20+)
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: kloud-gateway
  namespace: kloud
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: kloud-tls-cert
      allowedRoutes:
        namespaces:
          from: Same

---
# HTTP Route for API
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: kloud
spec:
  parentRefs:
    - name: kloud-gateway
  hostnames:
    - "api.kloud.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: kloud-api-service
          port: 8000
      timeouts:
        request: 30s
        backendRequest: 30s

---
# HTTP Route for Frontend
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: kloud
spec:
  parentRefs:
    - name: kloud-gateway
  hostnames:
    - "app.kloud.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kloud-frontend-service
          port: 3000


