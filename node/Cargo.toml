[package]
name = "node"
version = "0.1.0"
edition = "2021"

[dependencies]
algebra = { path = "../algebra" }
protocol = { path = "../protocol" }
security = { path = "../security" }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
sha3 = "0.10"
axum = "0.7"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.21"
aes-gcm = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }