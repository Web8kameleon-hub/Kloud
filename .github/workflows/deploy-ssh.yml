# =============================================================================
# KLOUD - DOCKER COMPOSE DEPLOYMENT VIA SSH
# =============================================================================
# Deploys to Hetzner server using SSH and Docker Compose
# Server: 46.224.203.89 (kameleon.life)
#
# This workflow:
# 1. SSHs to Hetzner and runs git pull
# 2. Builds Docker images on server
# 3. Restarts containers with new images
# =============================================================================

name: "🚀 Deploy via SSH (Docker Compose)"

on:
  # Auto-deploy on push to main (apps/web changes)
  push:
    branches: [ master, main ]
    paths:
      - 'apps/web/**'
      - 'apps/web/app/**'
  workflow_call:
    secrets:
      HETZNER_SSH_KEY:
        required: false
  # Manual dispatch for full control
  workflow_dispatch:
    inputs:
      scope:
        description: 'Deployment scope'
        required: true
        default: 'rebuild-core'
        type: choice
        options:
          - pull-only        # Just git pull, no rebuild
          - rebuild-core     # Rebuild core containers
          - rebuild-aviation # Rebuild ONLY aviation-weather service
          - full-rebuild     # Rebuild all containers

concurrency:
  group: ssh-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HETZNER_IP: 91.98.47.131
  DEPLOY_PATH: /opt/kloud
  FLUID_AUTOSTART: "true"
  WWWMMM_AUTORUN: "true"
  PRIMARY_RESONANT_PROFILE: "wwwmmm-ndb-stigma-tide-rezonance-nanogrid"
  ADAPTIVE_COMPAT_MODE: "true"
  OLD_MODE_ON_MISMATCH: "true"
  RESONANT_WRITE_MODE: "new-first"
  RESONANT_FALLBACK_MODE: "old-modus"

jobs:
  deploy-ssh:
    name: "🚀 Deploy to Hetzner via SSH"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Check for required secrets
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          if [ -z "$HETZNER_SSH_KEY" ]; then
            echo "⚠️ HETZNER_SSH_KEY secret not set"
            echo "::warning::HETZNER_SSH_KEY secret is required for SSH deployment"
            exit 1
          fi
          echo "✅ Required secrets are present"

      - name: Setup SSH Key
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Git Pull on Server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.HETZNER_IP }} << 'ENDSSH'
          cd ${{ env.DEPLOY_PATH }}
          echo "📥 Pulling latest code..."
          git pull origin master || git pull origin main
          echo "✅ Code updated"
          ENDSSH

      - name: Configure WWWMMM Fluid on Server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.HETZNER_IP }} << ENDSSH
          cd ${{ env.DEPLOY_PATH }}
          touch .env

          set_kv () {
            key="$1"
            val="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${val}|" .env
            else
              echo "${key}=${val}" >> .env
            fi
          }

          set_kv "FLUID_AUTOSTART" "${{ env.FLUID_AUTOSTART }}"
          set_kv "WWWMMM_AUTORUN" "${{ env.WWWMMM_AUTORUN }}"
          set_kv "PRIMARY_RESONANT_PROFILE" "${{ env.PRIMARY_RESONANT_PROFILE }}"
          set_kv "ADAPTIVE_COMPAT_MODE" "${{ env.ADAPTIVE_COMPAT_MODE }}"
          set_kv "OLD_MODE_ON_MISMATCH" "${{ env.OLD_MODE_ON_MISMATCH }}"
          set_kv "RESONANT_WRITE_MODE" "${{ env.RESONANT_WRITE_MODE }}"
          set_kv "RESONANT_FALLBACK_MODE" "${{ env.RESONANT_FALLBACK_MODE }}"

          echo "✅ WWWMMM Fluid env synchronized"
          ENDSSH

      - name: Deploy - Pull Only
        if: inputs.scope == 'pull-only'
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.HETZNER_IP }} << 'ENDSSH'
          cd ${{ env.DEPLOY_PATH }}
          echo "🔄 Restarting services with new code..."
          docker-compose restart web api ocean-core
          echo "✅ Services restarted"
          ENDSSH

      - name: Deploy - Rebuild Core
        if: inputs.scope == 'rebuild-core'
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.HETZNER_IP }} << 'ENDSSH'
          cd ${{ env.DEPLOY_PATH }}
          echo "🔨 Rebuilding core containers..."
          docker-compose build --no-cache web api ocean-core
          docker-compose up -d web api ocean-core
          echo "✅ Core containers rebuilt"
          ENDSSH

      - name: Deploy - Rebuild Aviation Weather
        if: inputs.scope == 'rebuild-aviation'
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.HETZNER_IP }} << 'ENDSSH'
          cd ${{ env.DEPLOY_PATH }}
          echo "🛫 Rebuilding aviation-weather service..."
          docker-compose build --no-cache aviation
          docker-compose up -d aviation
          echo "✅ Aviation weather service rebuilt"
          ENDSSH

      - name: Deploy - Full Rebuild
        if: inputs.scope == 'full-rebuild'
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.HETZNER_IP }} << 'ENDSSH'
          cd ${{ env.DEPLOY_PATH }}
          echo "🔨 Full rebuild in progress..."
          docker-compose build --no-cache
          docker-compose up -d
          echo "✅ All containers rebuilt"
          ENDSSH

      - name: Verify Deployment
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.HETZNER_IP }} << 'ENDSSH'
          cd ${{ env.DEPLOY_PATH }}
          echo "📊 Container Status:"
          docker ps --format 'table {{.Names}}\t{{.Status}}' | grep -E 'healthy|Up'
          echo ""
          echo "🌐 Testing endpoints..."
          curl -s http://localhost:8000/health | head -c 100 && echo ""
          curl -s http://localhost:8000/status | head -c 100 && echo ""
          curl -s http://localhost:8030/health | head -c 100 && echo ""
          curl -s -o /dev/null -w "Website: HTTP %{http_code}\n" http://localhost:80/
          ENDSSH

      - name: Smoke Check (External HTTP)
        continue-on-error: true
        run: |
          set +e
          ENDPOINTS=(
            "https://clisonix.ai/health"
            "https://clisonix.ai/status"
            "https://clx.clisonix.ai/health"
            "https://clx.clisonix.ai/status"
            "https://cxl.i/health"
            "https://cxl.i/status"
            "https://lite.clisonix.ai/health"
            "https://lite.clisonix.ai/status"
            "https://kameleon.life/health"
            "https://kameleon.life/status"
          )

          OK=false
          for url in "${ENDPOINTS[@]}"; do
            echo "🔎 Checking $url"
            if curl -fsS --max-time 20 --retry 8 --retry-delay 4 --retry-all-errors "$url"; then
              echo "✅ Smoke check passed at $url"
              OK=true
              break
            fi
          done

          if [ "$OK" != "true" ]; then
            echo "⚠️ Smoke check endpoints not reachable yet after retries"
          fi
          exit 0

      - name: Generate Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Server | ${{ env.HETZNER_IP }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Scope | ${{ inputs.scope }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Access Points" >> $GITHUB_STEP_SUMMARY
          echo "- **Website:** https://kameleon.life" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** https://kameleon.life/api" >> $GITHUB_STEP_SUMMARY
          echo "- **Ocean:** Port 8030" >> $GITHUB_STEP_SUMMARY
