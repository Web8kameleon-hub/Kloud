---
name: benchmark-gate

on:
  pull_request: {}
  workflow_dispatch: {}

jobs:
  benchmark-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [intra_node, cross_node, edge_cloud]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pydantic psutil httpx

      - name: Run no-fake gate
        run: |
          python scripts/ci/check_no_fake.py

      - name: Start Kloud API
        run: |
          python -m uvicorn apps.api.master:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &

      - name: Wait for health endpoint
        run: |
          python - <<'PY'
          import sys
          import time
          from urllib.request import urlopen

          deadline = time.time() + 30
          url = 'http://127.0.0.1:8000/health'
          while time.time() < deadline:
              try:
                  with urlopen(url) as response:
                      if response.status == 200:
                          sys.exit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit('health endpoint did not become ready within 30s')
          PY

      - name: Run benchmark gate
        run: |
          python scripts/ci/run_benchmark_gate.py \
            --base-url http://127.0.0.1:8000 \
            --preset ${{ matrix.preset }}

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.preset }}
          path: reports/benchmark-${{ matrix.preset }}.json

      - name: Upload uvicorn log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-log-${{ matrix.preset }}
          path: uvicorn.log